name: nabu16 - TrollStore Lite and TrollApps
on:
  push:
    branches: [codex/nabu-app-store]
    paths:
      - '.github/workflows/app-store.yml'
      - 'configs/nabu-app-store.json'
      - 'patches/nabu-app-store/**'
      - 'tools/prepare_nabu_app_store.py'
      - 'tools/build_nabu_app_store.py'
      - 'tools/check_nabu_app_store.py'
      - 'userland/nabu/tests/app_store_child_status_test.c'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app-store:
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare pinned app sources and project patches
        run: python3 tools/prepare_nabu_app_store.py --fetch --output build/nabu-app-store/sources
      - name: Check real child process return statuses
        run: python3 tools/check_nabu_app_store.py --sources build/nabu-app-store/sources --output artifacts/nabu-app-store-host-check
      - name: Build and sign both arm64 iPadOS apps
        run: python3 tools/build_nabu_app_store.py --sources build/nabu-app-store/sources --output artifacts/nabu-app-store --mode all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nabu-app-store-${{ github.run_number }}
          path: |
            artifacts/nabu-app-store/*.ipa
            artifacts/nabu-app-store/*.json
            artifacts/nabu-app-store/*.log
            artifacts/nabu-app-store-host-check/
            build/nabu-app-store/sources/source-report.json
          retention-days: 14
