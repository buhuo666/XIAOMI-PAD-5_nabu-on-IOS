name: nabu16 - Metal encoding CPU attribution
on:
  push:
    branches: [nabu16-bootstrap]
    paths:
      - '.github/workflows/gpu-encode-profile.yml'
      - 'tools/build_nabu_metal_encode_profile.py'
      - 'tools/nabu_metal_encode_profile.py'
      - 'tools/check_nabu_metal_encode_profile.py'
      - 'tools/nabu_metal_encode_analysis.py'
      - 'patches/nabu-metal/NativeMetalEncodeProfile.inc'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  encode-profile:
    runs-on: macos-15-intel
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Retrieve qualified GPU230 frontend and Rust archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download 43184629696 --name nabu-gpu-submit-3
          --dir inputs/qualified
      - name: Check per-command observation and exact frame association
        run: |
          python3 tools/check_nabu_metal_encode_profile.py --input inputs/qualified/nabu-gpu-submit --output artifacts/encode-profile-check
          python3 tools/check_nabu_metal_encode_analysis.py
          python3 tools/check_nabu_metal_submit_analysis.py
      - name: Relink iOS encoding observation frontend
        run: >-
          python3 tools/build_nabu_metal_encode_profile.py
          --input inputs/qualified/nabu-gpu-submit
          --output artifacts/nabu-encode-profile
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nabu-encode-profile-${{ github.run_number }}
          path: artifacts/
          retention-days: 14
