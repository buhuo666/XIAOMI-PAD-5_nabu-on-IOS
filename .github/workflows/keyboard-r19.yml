name: WTH326 r19 global keyboard
on:
  push:
    branches: ['codex/keyboard-r19-20261122']
    paths:
      - '.github/workflows/keyboard-r19.yml'
      - 'analysis/weather-WTH326/keyboard-r19/**'
      - 'userland/nabu/src/keyboard_*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  keyboard:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build sign and validate lazy global keyboard installation
        run: python3 analysis/weather-WTH326/keyboard-r19/run_keyboard_ci.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: WTH326-r19-keyboard
          path: artifacts/nabu-keyboard-WTH326-r19/
          retention-days: 14
