name: WTH326 r17 callback autorelease regression
on:
  push:
    branches: ['codex/metal-r17-callback-pool-20261121']
    paths:
      - '.github/workflows/metal-r17-callback-pool.yml'
      - 'analysis/weather-WTH326/metal-r17/workers/pipelines/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  callback-pool:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Final complete frontend protocol ABI queues pools and lifetime transport
        run: python3 analysis/weather-WTH326/metal-r17/workers/pipelines/run_global.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: WTH326-r17-callback-pool
          path: |
            artifacts/nabu-metal-callback-pool-WTH326-r17/
            analysis/weather-WTH326/metal-r17/workers/pipelines/lifetime-test/
          retention-days: 14
