name: nabu16 - iOS IOSurface copy reader
on:
  push:
    branches: [nabu16-bootstrap]
    paths:
      - '.github/workflows/gpu-iosurface-copy-read.yml'
      - 'tools/build_nabu_gpu_metal_probe.py'
      - 'tools/build_nabu_iosurface_default_probe.py'
      - 'patches/nabu-metal/0027-nabu-ios-copied-host-read.patch'
      - 'userland/nabu/src/gpu_iosurface_default_probe.mm'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  gpu-iosurface-copy-read:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fetch the same qualified frontend and runtime sources
        run: >-
          python3 tools/fetch_sources.py
          --only nabu UniXNU-turnip-reference AdrenoMetal metal2vulkan
          --report artifacts/gpu-iosurface-copy-read-sources.json
      - name: Reuse the Turnip, metallib, factory and helper qualified in run 170
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download 42607114009 --name nabu-gpu-iosurface-1
          --dir inputs/qualified-iosurface
      - name: Install the qualified bridge compiler dependencies
        run: |
          brew install llvm@21
          rustup toolchain install 1.98.1 --profile minimal --target aarch64-apple-ios
      - name: Build the iOS Mach copy reader and default IOSurface probe
        run: >-
          python3 tools/build_nabu_gpu_metal_probe.py
          --iosurface-copy-read --iosurface-input inputs/qualified-iosurface/nabu-gpu-iosurface
          --turnip-input inputs/qualified-iosurface/nabu-gpu-iosurface
          --work build/gpu-iosurface-copy-read --output artifacts/nabu-gpu-iosurface-copy-read
          --mtl-device-bytes 528 --llvm-as "$(brew --prefix llvm@21)/bin/llvm-as"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nabu-gpu-iosurface-copy-read-${{ github.run_number }}
          path: |
            artifacts/nabu-gpu-iosurface-copy-read/
            artifacts/gpu-iosurface-copy-read-sources.json
          retention-days: 14
