name: nabu16 - standalone A640 Metal
on:
  push:
    branches: [nabu16-bootstrap]
    paths:
      - '.github/workflows/gpu-metal.yml'
      - 'tools/build_nabu_gpu_metal_probe.py'
      - 'userland/nabu/src/gpu_metal_probe.mm'
      - 'userland/nabu/src/gpu_metal_smoke.metal'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  gpu-metal:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fetch pinned frontend and translator sources
        run: >-
          python3 tools/fetch_sources.py
          --only nabu UniXNU-turnip-reference AdrenoMetal metal2vulkan
          --report artifacts/gpu-metal-sources.json
      - name: Reuse the Turnip artifact qualified in run 166
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download 42576001993 --name nabu-gpu-vulkan-1
          --dir inputs/turnip-vulkan
      - name: Install bridge compiler dependencies
        run: |
          brew install llvm
          rustup toolchain install 1.98.1 --profile minimal --target aarch64-apple-ios
      - name: Build the iOS 16.5 frontend and Metal readback probe
        run: >-
          python3 tools/build_nabu_gpu_metal_probe.py
          --work build/gpu-metal --output artifacts/nabu-gpu-metal
          --turnip-input inputs/turnip-vulkan/nabu-gpu-vulkan
          --mtl-device-bytes 528 --llvm-as "$(brew --prefix llvm)/bin/llvm-as"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nabu-gpu-metal-${{ github.run_number }}
          path: |
            artifacts/nabu-gpu-metal/
            artifacts/gpu-metal-sources.json
          retention-days: 14
