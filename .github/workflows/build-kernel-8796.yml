name: build-xnu-8796

# Parallel line to build-kernel.yml (xnu-10063). This builds the XNU generation
# used with iPadOS 16.6.1; it does not build/prelink an iPadOS root filesystem.
#
# Hard constraints, learned from the reference project (mytiantian001/iPadOS-nabu,
# see docs/prior-art-mytiantian001-ipados-nabu.md):
#   * Xcode 16's iig emits IORPC.kernelContent, which xnu-8796 does not have ->
#     macOS 15 migration pins Xcode 16.2; compatibility is under test.
#   * libfirehose_kernel is built arm64e-only; the NABU kernel is plain arm64,
#     so build.sh has to be told to build arm64 as well.
#   * MACHINE_CONFIG=NABU selects the MASTER.arm64.nabu config that patch 0006 adds.

on:
  workflow_dispatch:
    inputs:
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
        type: choice
        options: [RELEASE, DEVELOPMENT, DEBUG]
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  push:
    branches: [main]
    paths:
      - "xnu-8796/patches/**"
      - "xnu-8796/prepare-dxb.py"
      - "xnu-8796/test-clock-fallback.py"
      - "xnu-8796/test-early-stage-mask.py"
      - "xnu-8796/test-project-system-root.py"
      - "tools/kernel-build-evidence.py"
      - ".github/workflows/build-kernel-8796.yml"

permissions:
  contents: read

concurrency:
  group: xnu8796-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: "13.5"          # -> xnu-8796.141.3
  ARCH_CONFIG: ARM64
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: NABU

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Test build evidence validation
        run: python3 tools/test-kernel-build-evidence.py

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # Fail on required device patches; keep dxb's optional version patches.
          python3 xnu-8796/prepare-dxb.py dxb/build.sh
          # Keep the project patches and source staging scripts next to dxb's
          cp xnu-8796/patches/*.patch xnu-8796/patches/*.sh dxb/patches/
          # the patch set was staged from a Windows checkout: patch(1) rejects CRLF
          for f in dxb/patches/*.patch dxb/patches/*.sh; do
            perl -pi -e 's/\r$//' "$f"
          done
          grep -lc $'\r' dxb/patches/*.patch 2>/dev/null | head -3 || echo "no CRLF left"
          # libfirehose_kernel is arm64e-only; the NABU kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -q 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh

      - name: Toolchain (macOS 15 / Xcode 16.2)
        run: |
          set -euo pipefail
          mkdir -p out
          {
            echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            sw_vers
            uname -m
            echo "Installed Xcode applications:"
            find /Applications -maxdepth 1 -name 'Xcode*.app' -print
          } | tee out/runner-environment.txt
          XC=/Applications/Xcode_16.2.app
          if ! test -d "$XC"; then
            echo "Xcode 16.2 is required but absent; kernel compilation was not attempted." | tee out/toolchain-error.txt
            exit 1
          fi
          export DEVELOPER_DIR="$XC/Contents/Developer"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcodebuild -version | tee out/toolchain.txt
          grep -qx 'Xcode 16.2' out/toolchain.txt
          grep -qx 'Build version 16C5032a' out/toolchain.txt
          xcrun --find iig | tee -a out/toolchain.txt
          xcrun clang --version | tee -a out/toolchain.txt
          sw_vers | tee -a out/toolchain.txt
          brew install jq gum bash cmake ninja || true
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes

      - name: Build
        working-directory: dxb
        env:
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: |
          set -o pipefail
          bash build.sh 2>&1 | tee build.log
          grep -c ' error: ' build.log || true

      - name: Verify and collect arm64 kernel
        if: success()
        run: |
          set -euo pipefail
          mkdir -p out
          python3 xnu-8796/test-clock-fallback.py --xnu-source dxb/xnu 2>&1 | tee out/source-tests.txt
          python3 xnu-8796/test-early-stage-mask.py --xnu-source dxb/xnu 2>&1 | tee -a out/source-tests.txt
          python3 xnu-8796/test-project-system-root.py --xnu-source dxb/xnu --cc clang 2>&1 | tee -a out/source-tests.txt
          python3 xnu-8796/test-keystore-registration.py --xnu-source dxb/xnu --cc clang 2>&1 | tee -a out/source-tests.txt
          python3 xnu-8796/test-amfi-service.py --xnu-source dxb/xnu --cc clang 2>&1 | tee -a out/source-tests.txt
          KERNEL_CONFIG_LOWER="$(printf '%s' "$KERNEL_CONFIG" | tr '[:upper:]' '[:lower:]')"
          KERNEL="dxb/build/xnu.obj/kernel.${KERNEL_CONFIG_LOWER}.nabu"
          test -s "$KERNEL"
          file "$KERNEL" | tee out/kernel-file.txt
          xcrun lipo "$KERNEL" -verify_arch arm64
          mkdir -p out
          cp "$KERNEL" out/kernel.macho
          (cd out && shasum -a 256 kernel.macho > SHA256SUMS)
          xcrun nm -U out/kernel.macho > out/kernel-symbols.txt
          grep -q ' _nabu_early_stage_mask$' out/kernel-symbols.txt
          git -C dxb rev-parse HEAD > out/dxb-commit.txt
          git -C dxb/xnu rev-parse HEAD > out/xnu-commit.txt
          git rev-parse HEAD > out/project-commit.txt
          shasum -a 256 dxb/patches/[0-9][0-9][0-9][0-9]-*.patch dxb/patches/[0-9][0-9][0-9][0-9]-*.sh > out/patch-SHA256SUMS
          cat > out/BUILD-NOTES.txt <<'EOF'
          kernel.macho is a raw XNU kernel for Xiaomi Pad 5 (nabu).
          It is not a kernelcache, prelinked kernel, IPSW, root filesystem, or bootable payload.
          It has not been tested on physical hardware by this workflow.
          The XNU baseline is xnu-8796.141.3 (macOS 13.5 generation), intended for
          compatibility investigation with iPadOS 16.6.1 (20G81).
          EOF

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp dxb/build.log out/build.log 2>/dev/null || true

      - name: Record verified build
        if: success()
        run: |
          python3 tools/kernel-build-evidence.py record \
            --directory out --patch-directory xnu-8796/patches \
            --source-commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --kernel-config "$KERNEL_CONFIG"

      - name: Upload
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: xnu-8796-kernel
          path: |
            out/
          if-no-files-found: error
