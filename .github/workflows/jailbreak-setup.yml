name: nabu16 - Persistent jailbreak setup
on:
  push:
    branches: [codex/nabu-app-store]
    paths:
      - '.github/workflows/jailbreak-setup.yml'
      - 'tools/build_nabu_jailbreak_setup.py'
      - 'userland/nabu/src/jailbreak_setup.m'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  setup:
    runs-on: macos-15-intel
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build signed persistent prefix installer
        run: python3 tools/build_nabu_jailbreak_setup.py --output artifacts/nabu-jailbreak-setup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nabu-jailbreak-setup-${{ github.run_number }}
          path: artifacts/nabu-jailbreak-setup/
          retention-days: 14
