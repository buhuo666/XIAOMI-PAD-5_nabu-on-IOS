name: nabu16 - standard Metal factory
on:
  push:
    branches: [nabu16-bootstrap]
    paths:
      - '.github/workflows/system-metal.yml'
      - 'tools/build_nabu_system_metal_probe.py'
      - 'userland/nabu/src/NabuMetalFrontendApi.h'
      - 'userland/nabu/src/gpu_metal_factory.mm'
      - 'userland/nabu/src/gpu_metal_mount.c'
      - 'userland/nabu/src/gpu_metal_probe.mm'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  system-metal:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fetch the qualified kernel ABI source
        run: python3 tools/fetch_sources.py --only nabu --report artifacts/system-metal-source.json
      - name: Reuse the frontend, Turnip and metallib qualified in run 167
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 42590211952 --name nabu-gpu-metal-1 --dir inputs/qualified-metal
      - name: Build the thin bundle and standard-factory probe
        run: >-
          python3 tools/build_nabu_system_metal_probe.py
          --input inputs/qualified-metal/nabu-gpu-metal
          --output artifacts/nabu-system-metal
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nabu-system-metal-${{ github.run_number }}
          path: |
            artifacts/nabu-system-metal/
            artifacts/system-metal-source.json
          retention-days: 14
