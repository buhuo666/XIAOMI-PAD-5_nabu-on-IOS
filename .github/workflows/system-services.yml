name: nabu16 - system services probe
on:
  push:
    branches: [nabu16-bootstrap]
    paths:
      - '.github/workflows/system-services.yml'
      - 'tools/build_nabu_system_service_probe.py'
      - 'userland/nabu/src/system_service_probe.m'
      - 'userland/nabu/src/wallpaper_probe.m'
      - 'userland/nabu/src/sqlite_vnode_watch.m'
      - 'userland/nabu/src/experience_probe.m'
      - 'userland/nabu/src/experience_compat.m'
      - 'userland/nabu/src/bluetooth_probe.m'
      - 'userland/nabu/src/wifi_control_probe.m'
      - 'userland/nabu/system-service-probe.entitlements.plist'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  system-services:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile filesystem and LaunchServices diagnostic
        run: python3 tools/build_nabu_system_service_probe.py --output artifacts/nabu-system-service-probe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nabu-system-service-probe-${{ github.run_number }}
          path: artifacts/nabu-system-service-probe/
          retention-days: 14
