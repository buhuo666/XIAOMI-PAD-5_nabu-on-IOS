name: nabu16 - owned copied host mappings
on:
  push:
    branches: [nabu16-bootstrap]
    paths:
      - '.github/workflows/gpu-owned-copy-pages.yml'
      - 'patches/nabu-metal/NativeCopiedPages.rs'
      - 'tools/check_nabu_owned_copy_pages.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  owned-copy-pages:
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fetch qualified sources
        run: >-
          python3 tools/fetch_sources.py
          --only nabu UniXNU-turnip-reference AdrenoMetal metal2vulkan
          --report artifacts/gpu-owned-copy-sources.json
      - name: Reuse qualified Turnip and surface inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download 42607114009 --name nabu-gpu-iosurface-1
          --dir inputs/qualified-iosurface
      - name: Install native bridge compilers
        run: |
          brew install llvm@21
          rustup toolchain install 1.98.1 --profile minimal --target aarch64-apple-ios
      - name: Exercise real Mach sharing and copied buffer lifetime
        run: >-
          python3 tools/check_nabu_owned_copy_pages.py
          --output artifacts/copied-pages-host-check
      - name: Build the copied-source lifetime fix with prior resource fixes
        run: >-
          python3 tools/build_nabu_gpu_metal_probe.py
          --owned-copy-pages --system-resources --system-shaders --iosurface-copy-read
          --iosurface-input inputs/qualified-iosurface/nabu-gpu-iosurface
          --turnip-input inputs/qualified-iosurface/nabu-gpu-iosurface
          --work build/gpu-owned-copy-pages --output artifacts/nabu-owned-copy-pages
          --mtl-device-bytes 528 --llvm-as "$(brew --prefix llvm@21)/bin/llvm-as"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nabu-owned-copy-pages-${{ github.run_number }}
          path: |
            artifacts/nabu-owned-copy-pages/
            artifacts/copied-pages-host-check/
            artifacts/gpu-owned-copy-sources.json
          retention-days: 14
