name: build-darwinboot

on:
  workflow_dispatch:
    inputs:
      kernel_run_id:
        description: Successful build-xnu-8796 run from this source commit
        type: string
        required: true
      kernel_sha256:
        description: Expected SHA-256 of that run's kernel.macho
        type: string
        required: true
      observe_kernel:
        description: Observe the real open-source kernel in QEMU (experimental)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read

concurrency:
  group: darwinboot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      KERNEL_RUN: ${{ inputs.kernel_run_id }}
      KERNEL_SHA256: ${{ inputs.kernel_sha256 }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate explicit kernel selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$KERNEL_RUN" =~ ^[0-9]+$ ]]
          [[ "$KERNEL_SHA256" =~ ^[0-9a-f]{64}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$KERNEL_RUN" > kernel-run.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads(Path("kernel-run.json").read_text())
          assert run["status"] == "completed" and run["conclusion"] == "success", "Kernel build did not succeed"
          assert run["head_sha"] == os.environ["GITHUB_SHA"], "Kernel came from a different source commit"
          assert run["repository"]["full_name"] == os.environ["GITHUB_REPOSITORY"], "Wrong kernel repository"
          assert run["path"] == ".github/workflows/build-kernel-8796.yml", "Wrong kernel workflow"
          PY

      - name: Install LLVM
        run: |
          set -euo pipefail
          brew install llvm lld nasm qemu
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          mkdir -p "$GITHUB_WORKSPACE/toolchain"
          for tool in clang llvm-lib llvm-rc; do
            ln -s "$(brew --prefix llvm)/bin/$tool" "$GITHUB_WORKSPACE/toolchain/$tool"
          done
          ln -s "$(brew --prefix lld)/bin/lld-link" "$GITHUB_WORKSPACE/toolchain/lld-link"
          echo "CLANG_BIN=$GITHUB_WORKSPACE/toolchain/" >> "$GITHUB_ENV"

      - name: Prepare pinned sources
        run: bash loader/prepare.sh

      - name: Download verified kernel
        uses: actions/download-artifact@v4
        with:
          name: xnu-8796-kernel
          path: verified-kernel
          github-token: ${{ github.token }}
          run-id: ${{ env.KERNEL_RUN }}

      - name: Check parsers and real kernel contract
        run: |
          set -euo pipefail
          test "$(shasum -a 256 verified-kernel/kernel.macho | cut -d ' ' -f 1)" = "$KERNEL_SHA256"
          python3 tools/kernel-build-evidence.py verify \
            --directory verified-kernel --patch-directory xnu-8796/patches \
            --source-commit "$GITHUB_SHA" --run-id "$KERNEL_RUN" \
            --kernel-sha256 "$KERNEL_SHA256"
          mkdir -p out/diagnostic
          cp verified-kernel/build-manifest.json out/kernel-build-manifest.json
          python3 loader/scripts/test-boot-contract.py --framework sources/framework --cc clang
          python3 loader/scripts/test-probe-analysis.py
          python3 loader/scripts/test-framebuffer-decode.py
          python3 loader/scripts/test-register-symbols.py
          python3 loader/scripts/test-boot-progress.py
          python3 loader/scripts/test-userdata-preservation.py --framework sources/framework
          python3 tools/test-fastboot-report.py
          python3 tools/test-project-space.py
          python3 loader/scripts/test-qemu-upstream-fixtures.py --framework sources/framework
          python3 loader/scripts/test-handoff-dump.py --framework sources/framework
          python3 loader/scripts/make-nabu-diagnostic-adt.py \
            --dram-size 0x300000000 --output out/diagnostic/kernel.macho.adt
          python3 loader/scripts/check-boot-contract.py --framework sources/framework \
            --kernel verified-kernel/kernel.macho --adt out/diagnostic/kernel.macho.adt \
            --xnu-source sources/xnu --cc clang --output out/diagnostic/boot-contract.json

      - name: Build loader variants
        run: |
          set -o pipefail
          bash loader/build.sh 2>&1 | tee out/build.log

      - name: Observe real kernel in QEMU
        if: inputs.observe_kernel == true
        run: |
          set -o pipefail
          bash loader/observe-kernel.sh 2>&1 | tee out/kernel-observation.log

      - name: Record artifacts
        if: always() && !cancelled()
        run: |
          mkdir -p out
          cp loader/README.md out/BUILD-NOTES.md
          python3 loader/manifest.py out

      - name: Upload build evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: darwinboot-macos
          path: out/
          if-no-files-found: error
