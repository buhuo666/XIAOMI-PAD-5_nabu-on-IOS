name: nabu16 - Bluetooth userland transport analysis
on:
  push:
    branches: [nabu16-bootstrap]
    paths:
      - '.github/workflows/bluetooth-userland-analysis.yml'
      - 'analysis/bluetooth/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bluetooth-userland:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read selected original Bluetooth executables
        run: python3 analysis/bluetooth/extract_original_userland.py
      - name: Download the existing pinned Ghidra release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/NationalSecurityAgency/ghidra/releases/tags/Ghidra_12.2_build > log/ci/bluetooth-userland/ghidra-release.json
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess,urllib.request
          release=json.loads(pathlib.Path('log/ci/bluetooth-userland/ghidra-release.json').read_text())
          asset=next(a for a in release['assets'] if a['name']=='ghidra_12.2_PUBLIC_20261016.zip')
          archive=pathlib.Path('build/ghidra.zip')
          urllib.request.urlretrieve(asset['browser_download_url'],archive)
          if 'sha256:'+hashlib.sha256(archive.read_bytes()).hexdigest() != asset['digest']:
              raise RuntimeError('Ghidra download digest mismatch')
          subprocess.run(['unzip','-q',str(archive),'-d','build'],check=True)
          PY
      - name: Recover transport choices and initialization callers
        run: |
          export JAVA_HOME="$(/usr/libexec/java_home -v 21)"
          mkdir -p build/ghidra-bt-userland
          for name in BlueTool bluetoothd; do
            build/ghidra_12.2_PUBLIC/support/analyzeHeadless build/ghidra-bt-userland "$name" -import "log/ci/bluetooth-userland/$name" -analysisTimeoutPerFile 300 -scriptPath analysis/bluetooth -postScript ExportBluetoothUserland.java log/ci/bluetooth-userland "$name" -log "log/ci/bluetooth-userland/$name-ghidra.log"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bluetooth-userland-analysis-${{ github.run_number }}
          path: |
            log/ci/bluetooth-userland/*.c
            log/ci/bluetooth-userland/*.asm
            log/ci/bluetooth-userland/*.json
            log/ci/bluetooth-userland/*.log
          retention-days: 14
