name: WIFI373 optional PMF negotiation
on:
  push:
    branches: [codex/wifi373-optional-pmf-20261128]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ath10k-optional-pmf:
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build the exact source for optional PMF negotiation
        run: python3 tools/build_nabu_ath10k.py --nabu-platform --proxy '' --output artifacts/nabu-ath10k --log log/ci/ath10k-optional-pmf
      - name: Replay observed request and six modes using built source
        run: python3 tools/check_nabu_wifi_security.py --backend-only --backend-source build/nabu-ath10k/personal-security-WIFI373/reference/wifi/lx/src/lx_80211.c --output log/ci/wifi373-backend
      - name: Retain source and backend objects
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wifi373-backend-${{ github.run_number }}
          path: |
            artifacts/nabu-ath10k/
            log/ci/
            build/nabu-ath10k/personal-security-WIFI373/reference/
          retention-days: 14
          if-no-files-found: warn
