name: nabu16 - UIKit Metal presentation App
on:
  push:
    branches: [nabu16-bootstrap]
    paths:
      - '.github/workflows/gpu-metal-present-app.yml'
      - 'tools/build_nabu_metal_present_app.py'
      - 'userland/nabu/apps/MetalPresent/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  metal-present-app:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fetch the qualified GPU ABI headers
        run: >-
          python3 tools/fetch_sources.py --only nabu
          --report artifacts/metal-present-app-source.json
      - name: Reuse the frontend and shaders qualified in run 172
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download 42615860281 --name nabu-gpu-iosurface-copy-read-2
          --dir inputs/qualified-runtime
      - name: Build only the self-owned UIKit App
        run: >-
          python3 tools/build_nabu_metal_present_app.py
          --input inputs/qualified-runtime/nabu-gpu-iosurface-copy-read
          --output artifacts/nabu-metal-present-app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nabu-metal-present-app-${{ github.run_number }}
          path: |
            artifacts/nabu-metal-present-app/
            artifacts/metal-present-app-source.json
          retention-days: 14
