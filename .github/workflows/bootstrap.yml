name: nabu16 - 8796 macOS compilation

on:
  push:
    branches: [nabu16-bootstrap]
    paths:
      - '.github/workflows/bootstrap.yml'
      - 'tools/**'
      - 'configs/**'
      - 'patches/8796/**'
      - 'patches/darwinboot/**'
      - 'patches/nabu-storage/**'
      - 'patches/nabu-input/**'
      - 'patches/nabu-wireless/**'
      - 'patches/nabu-apfs/**'
      - 'patches/nabu-userland/**'
      - 'userland/nabu/**'
  workflow_dispatch:
    inputs:
      runner:
        description: 'macOS host pool (both use Xcode 16.4 and target arm64)'
        type: choice
        default: macos-15
        options:
          - macos-15
          - macos-15-intel

permissions:
  contents: read

jobs:
  wireless-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install protocol test compiler
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang-18
      - name: Replay WLFW, DIAG framing and production GLINK with sanitizers
        run: |
          python3 tools/check_nabu_modem_power.py --output log/ci/nabu-modem-power
          python3 tools/check_nabu_wireless_start.py --output log/ci/nabu-wireless-start
          python3 tools/check_nabu_wlan_config.py --output log/ci/nabu-wlan-config
          python3 tools/check_nabu_wlfw.py --output log/ci/nabu-wlfw
          python3 tools/check_nabu_diag_frames.py --output log/ci/nabu-diag-frames
          python3 tools/check_nabu_glink.py --output log/ci/nabu-glink
      - name: Retain wireless protocol results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wireless-protocol-${{ github.run_number }}
          path: log/ci/nabu-*/
          retention-days: 14
          if-no-files-found: warn
  xnu8796-reference:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Record build host
        run: |
          mkdir -p log/ci
          {
            sw_vers
            xcodebuild -version
            xcrun clang --version
            python3 --version
          } > log/ci/host.txt
          cat log/ci/host.txt
      - name: Check and compile the explicit SpringBoard UI compatibility library
        run: |
          python3 tools/check_nabu_setup_compat.py --output log/ci/nabu-setup-compat
          python3 tools/build_nabu_setup_compat.py --output artifacts/nabu-setup-compat
          cp log/ci/nabu-setup-compat/report.json artifacts/nabu-setup-compat/host-check.json
      - name: Compile 8796 reference
        run: bash tools/build_8796_reference.sh
      - name: Compile the APFS Data block device
        run: python3 tools/build_nabu_data_block.py --tree build/xnu8796-reference/tree --output artifacts/nabu-data-block
      - name: Verify linked kernel against the selected export contract
        if: always() && hashFiles('artifacts/8796-reference/mach.development.bcm2837.unstripped') != ''
        run: python3 tools/check_nabu_export_contract.py --tree build/xnu8796-reference/tree --verify-generated --candidate artifacts/8796-reference/mach.development.bcm2837.unstripped --output log/ci/nabu-export-contract-linked.json
      - name: Analyze original and candidate interfaces with native LLDB
        if: always() && hashFiles('artifacts/8796-reference/mach.development.bcm2837.unstripped') != ''
        run: bash tools/analyze_20f66_ci.sh
      - name: Verify compiled SMP and bootstrap capacity
        if: always() && hashFiles('artifacts/8796-reference/mach.development.bcm2837.unstripped') != ''
        run: python3 tools/check_capacity_kernel.py --tree build/xnu8796-reference/tree --candidate artifacts/8796-reference/mach.development.bcm2837.unstripped --output log/ci/capacity-native
      - name: Verify return diagnostics with native LLDB
        if: always() && hashFiles('artifacts/8796-reference/mach.development.bcm2837.unstripped') != ''
        run: python3 tools/check_return_diagnostics.py --tree build/xnu8796-reference/tree --candidate artifacts/8796-reference/mach.development.bcm2837.unstripped --output log/ci/return-diagnostics-native
      - name: Verify native storage policies and compiled probe
        if: always() && hashFiles('artifacts/8796-reference/mach.development.bcm2837.unstripped') != ''
        run: python3 tools/check_nabu_storage.py --tree build/xnu8796-reference/tree --candidate artifacts/8796-reference/mach.development.bcm2837.unstripped --output log/ci/nabu-storage/native
      - name: Verify native display geometry and compiled consumers
        if: always() && hashFiles('artifacts/8796-reference/mach.development.bcm2837.unstripped') != ''
        run: python3 tools/check_nabu_display.py --tree build/xnu8796-reference/tree --candidate artifacts/8796-reference/mach.development.bcm2837.unstripped --output log/ci/nabu-display-native
      - name: Retain build logs and source-built kernel
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xnu8796-reference-${{ github.run_number }}
          path: |
            log/ci/
            artifacts/8796-reference/
            artifacts/nabu-userland/
            artifacts/nabu-setup-compat/
            artifacts/nabu-input-bridge/
            artifacts/nabu-data-block/
            src/hakios-8796/xnu-deps/*build.log
            src/hakios-8796/xnu-deps/exporthdrs.log
          retention-days: 14
          if-no-files-found: warn
