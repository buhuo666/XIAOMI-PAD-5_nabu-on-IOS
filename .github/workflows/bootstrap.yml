name: nabu16 - 8796 macOS compilation

on:
  push:
    branches: [nabu16-bootstrap, codex/int333-source]
    paths:
      - '.github/workflows/bootstrap.yml'
      - 'tools/**'
      - 'configs/**'
      - 'patches/8796/**'
      - 'patches/darwinboot/**'
      - 'patches/nabu-storage/**'
      - 'patches/nabu-input/**'
      - 'patches/nabu-display/**'
      - 'patches/nabu-wireless/**'
      - 'patches/nabu-audio/**'
      - 'patches/nabu-gpu/**'
      - 'patches/nabu-ath10k/**'
      - 'patches/nabu-apfs/**'
      - 'patches/nabu-userland/**'
      - 'userland/nabu/**'
  workflow_dispatch:
    inputs:
      runner:
        description: 'macOS host pool (both use Xcode 16.4 and target arm64)'
        type: choice
        default: macos-15
        options:
          - macos-15
          - macos-15-intel

permissions:
  contents: read

jobs:
  ath10k-backend:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile and relocatable-link the pinned Nabu ath10k backend
        run: |
          python3 tools/build_nabu_ath10k.py --reference build/nabu-ath10k/reference \
            --nabu-platform --proxy '' --log log/ci/nabu-ath10k \
            --linker "$(xcrun --find ld)"
          test -f artifacts/nabu-ath10k/ath10k.o
      - name: Replay the ready-only registration handoff
        run: python3 tools/check_nabu_ath10k_handoff.py --source build/nabu-ath10k/native-management-int333-r1/linux/ath10k/qmi.c --output log/ci/nabu-ath10k-handoff
      - name: Validate selected WPA2 backend security
        run: python3 tools/check_nabu_wifi_security.py --backend-only --backend-source build/nabu-ath10k/native-management-int333-r1/reference/wifi/lx/src/lx_80211.c --output log/ci/nabu-wifi-security-backend
      - name: Replay station startup rollback
        run: python3 tools/check_nabu_ath10k_station.py --source build/nabu-ath10k/native-management-int333-r1/reference/wifi/lx/src/lx_80211.c --output log/ci/nabu-ath10k-station
      - name: Check actual native management sequence allocation
        run: python3 tools/check_nabu_management_sequence.py --source build/nabu-ath10k/native-management-int333-r1/reference/wifi/lx/src/lx_80211.c --mac build/nabu-ath10k/native-management-int333-r1/linux/ath10k/mac.h --output log/ci/nabu-ath10k-sequence
      - name: Retain the combined backend and build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nabu-ath10k-${{ github.run_number }}
          path: |
            artifacts/nabu-ath10k/
            log/ci/nabu-ath10k*/
            log/ci/nabu-wifi-security-backend/
          retention-days: 14
          if-no-files-found: warn
