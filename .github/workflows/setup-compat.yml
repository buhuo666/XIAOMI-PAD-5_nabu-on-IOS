name: nabu16 - setup state compatibility
on:
  push:
    branches: [nabu16-bootstrap]
    paths:
      - '.github/workflows/setup-compat.yml'
      - 'tools/check_nabu_setup_compat.py'
      - 'tools/build_nabu_setup_compat.py'
      - 'userland/nabu/src/setup_compat.c'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  setup-compat:
    runs-on: macos-15
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: |
          python3 tools/check_nabu_setup_compat.py --output log/ci/nabu-setup-compat
          python3 tools/build_nabu_setup_compat.py --output artifacts/nabu-setup-compat
          cp log/ci/nabu-setup-compat/report.json artifacts/nabu-setup-compat/host-check.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nabu-setup-compat-${{ github.run_number }}
          path: artifacts/nabu-setup-compat/
          retention-days: 14
