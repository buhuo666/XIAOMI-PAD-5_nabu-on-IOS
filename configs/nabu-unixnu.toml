version = 1

[boot]
timeout = 5
fallback_timeout = 5
connect_all = true
default = "nabu8796"

[ui]
title = "Nabu XNU 8796"
layout = "portrait"
console = "auto"

[[driver]]
path = '\EFI\Nabu16\DarwinBoot.efi'
connect = true

[[entry]]
id = "nabu8796"
title = "XNU 8796 - userland bootstrap"
type = "xnu"
path = '\EFI\Nabu16\Payloads\kernel.macho'
initrd = '\EFI\Nabu16\Payloads\bootstrap.apfs'
args = "-v keepsyms=1 debug=0x14e cpus=8 small_cores_after=0 serial=0 -enable_kprintf_spam nabu-storage=1 nabu-bootstrap=1 rd=md0 root_apfs=nabu_os loader_return_after=120 ustacks=backboardd ustacks_at=90 ustacks_count=1 ustacks_threads=4 ustacks_tname=coreanimation"

[[entry]]
id = "reset"
title = "Return to Android"
type = "action"
action = "reset"
