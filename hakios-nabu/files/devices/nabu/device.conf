# devices/nabu/device.conf: what this device repository is (docs/porting/repositories.md has every word).

device nabu
	title       Xiaomi Pad 5 (12 GiB)
	vendor      Xiaomi
	soc         sm8150
	defconfig   nabu_defconfig
	maintainer  Local nabu port
	status      display     partial   1600x2560 panel known; this HakiOS port has not run
	status      cpu         partial   8 Kryo 485 cores known; initial HakiOS configuration uses one
	status      touch       missing   NT36523 on GENI SPI SE18; implement through /dev/hakios-touch
	status      buttons     missing   nabu PMIC and GPIO routing must be ported
	status      gpu         missing   Adreno 640 v2 requires SM8150 power, SMMU, GMU and Mesa validation
	status      storage     missing   nabu_esp and nabu_system only; upstream darwin layout is not applicable
	status      audio       missing   nabu DSP and codecs not ported
	status      battery     missing   nabu power supplies not ported
	status      wifi        missing   nabu radio not ported
	status      bluetooth   missing   not ported
	status      camera      missing   nabu sensors and ISP not ported
	status      haptic      missing   not ported
	status      usb         missing   this HakiOS loader has not run on nabu
	status      network     missing   no nabu network driver enabled
